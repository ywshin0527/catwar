 const T=[setTimeout(()=>{const s=$('st');if(s)s.textContent='강력한 기운이...!'},1300),setTimeout(()=>{o.innerHTML=`<div class=fl></div><div class=big style="--c:${col}"><img src="${bigic(c.e)}" class=sil><div class=bn>★ ${RN[b.r]} ★</div><div class=bt>${c.n}</div></div>`},2700),setTimeout(res,5200)];
 o.onclick=()=>{if(o.querySelector('button'))return;T.forEach(clearTimeout);res()}}
function anim0(out){const o=$('gm');o.style.display='flex';o.innerHTML='<div class=egg></div><div>두근두근...</div>';
 setTimeout(()=>{o.innerHTML='<div class=fl></div><div class=rs>'+out.map((x,k)=>{const c=CATS[x.i];return `<div class=rc style="--rc:${RC[c.rar]};animation-delay:${k*.15}s"><img src="${ic(c.e)}"><br>${RN[c.rar]}<br><b>${c.n}</b><br>${x.had?'Lv'+x.lv:'NEW!'}</div>`}).join('')+'</div>'+`<button class=pri onclick="document.getElementById('gm').style.display='none';home()">확인</button>`},1600)}
function roll0(n){const cost=n==1?200:1800;if(P.gold<cost)return;P.gold-=cost;const out=[];
 for(let t=0;t<n;t++){const r=Math.random(),rar=r<.5?1:r<.78?2:r<.93?3:r<.99?4:5,pool=CATS.map((c,i)=>i).filter(i=>CATS[i].rar==rar),i=pool[Math.floor(Math.random()*pool.length)];
  const had=P.cats[i];P.cats[i]=had?Math.min(10,had+1):1;
  if(!had&&P.deck.length<5)P.deck.push(i);out.push(`<img src="${ic(CATS[i].e)}"> ${CATS[i].n} [${RN[rar]}] ${had?'→ Lv'+P.cats[i]:(P.deck.includes(i)?'NEW! 출전 덱에 추가':'NEW! (덱이 가득 참)')}`)}
 gmsg=out.join('\n');save();home()}

const cv=$('c'),ctx=cv.getContext('2d');let W,H,G,S,st;
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;G=H-40}
addEventListener('resize',fit);
const L=1000;
function play(i){const ec=eCost(i);if(nrg()<ec){toast('피로도가 부족해요 (⚡'+ec+' 필요)');return}if(P.en>=EMAX)P.et=Date.now();P.en-=ec;save();if(i>9||(P.seen||[]).includes(i))return go(i);P.seen=(P.seen||[]).concat(i);save();story(i,()=>go(i))}
function go(i){music('battle');
 st=STG[i];$('home').classList.remove('on');$('battle').classList.add('on');fit();
 const dk=P.deck.map(id=>({id,...CATS[id],lv:P.cats[id]}));
 S={i,dk,money:60+25*(P.up.m||0),lvl:1,t:0,cats:[],foes:[],fx:[],cd:dk.map(()=>0),spawnT:4,wave:0,cannon:0,over:false,
  my:{hp:2500*(1+.3*P.up.h),x:L-30},en:{hp:st.hp,x:30}};
 S.my.mhp=S.my.hp;S.en.mhp=S.en.hp;
 S.pg=0;barUI();return;
 dk.forEach((c,k)=>{const b=document.createElement('button');b.className='u';b.innerHTML=`<b><img src="${ic(c.e,c.lv>=10)}"></b><span>${c.c}</span><i></i>`;b.onclick=()=>spawn(k);$('bar').appendChild(b)});
}
function barUI(){const bar=$('bar');bar.innerHTML='';
 S.dk.forEach((c,k)=>{if(Math.floor(k/5)!=S.pg)return;const b=document.createElement('button');b.className='u';b.dataset.k=k;b.innerHTML=`<b><img src="${ic(c.e,c.lv>=10)}"></b><span>${c.c}</span><i></i>`;b.onclick=()=>spawn(k);bar.appendChild(b)});
 if(S.dk.length>5){const a=document.createElement('button');a.className='u';a.style.flex='.5';a.innerHTML=`<b>${S.pg?'◀':'▶'}</b><span>${S.pg?'앞줄':'뒷줄'}</span>`;a.onclick=()=>{S.pg=1-S.pg;barUI()};bar.appendChild(a)}}
function spawn(k){const c=S.dk[k];if(S.over||S.money<c.c||S.cd[k]>0)return;S.money-=c.c;S.cd[k]=c.cd*(1-.04*(P.up.c||0));
 const m=mul(c.lv);S.cats.push({...c,hp:c.hp*m*(1+.06*(P.up.b||0)),mhp:c.hp*m*(1+.06*(P.up.b||0)),atk:c.atk*m*(1+.06*(P.up.a||0)),spd:c.spd*(1+.04*(P.up.s||0)),evo:c.lv>=10,x:S.my.x-10,t:0,k:0,team:0})}
function foe(){const n=S.wave++,p=st.foes;let k=p[Math.min(p.length-1,Math.floor(Math.random()*Math.random()*(1+n/4)))];
 if(n%10==9)k=p[p.length-1];else if(FOES[k].r>=30&&S.foes.some(f=>f.r>=30))k=p[0];const f=FOES[k],m=1+Math.min(S.i,10)*.14;
 S.foes.push({...f,hp:f.hp*m,mhp:f.hp*m,atk:f.atk*(1+Math.min(S.i,10)*.1),x:S.en.x+10,t:0,k:0,team:1});S.spawnT=Math.max(2.3,6-n*.09)}
$('wup').onclick=()=>{if(S.over||S.lvl>=9)return;const c=S.lvl*60;if(S.money>=c){S.money-=c;S.lvl++}};
$('cannon').onclick=()=>{if(S.cannon<1||S.over)return;S.cannon=0;const d=150*(1+.25*P.up.k);
 S.foes.forEach(f=>{f.hp-=d;f.k=30});S.fx.push({t:.4,beam:1})};
function step(dt){
 if(S.over)return;S.t+=dt;
 const mx=200+(S.lvl-1)*550;
 S.money=Math.min(mx,S.money+dt*(18+S.lvl*8+P.up.w*3));S.mx=mx;
 S.cannon=Math.min(1,S.cannon+dt/(15*(1-.05*(P.up.q||0))));S.cd=S.cd.map(v=>Math.max(0,v-dt));
 if((S.spawnT-=dt)<=0)foe();
 for(const u of [...S.cats,...S.foes]){
  const dir=u.team?1:-1,en=u.team?S.cats:S.foes,base=u.team?S.my:S.en;u.t-=dt;
  if(u.k>0){u.x-=dir*u.k*dt*3;u.k=Math.max(0,u.k-dt*60);continue}
  let tg=null,b=1e9;for(const o of en){const d=Math.abs(o.x-u.x);if(d<b){b=d;tg=o}}
  if(tg&&b<=u.rng){if(u.t<=0){u.t=u.rate;tg.hp-=u.atk*(u.team==0&&Math.random()<.03*(P.up.x||0)?2:1);u.at=S.t;if(tg.hp>0&&tg.hp<tg.mhp*.5&&!tg.kb){tg.kb=1;tg.k=14}S.fx.push({x:tg.x,t:.2})}}
  else if(Math.abs(base.x-u.x)<=u.rng){if(u.t<=0){u.t=u.rate;base.hp-=u.atk;u.at=S.t;S.fx.push({x:base.x,t:.2})}}
  else u.x+=dir*u.spd*dt;
  if(u.rng>100&&u.rng<300&&u.team==0&&Math.abs(S.en.x-u.x)>u.rng*.45&&!(tg&&b<u.rng*.45)&&(b<=u.rng||Math.abs(S.en.x-u.x)<=u.rng))u.x-=u.spd*dt*.5}
 S.cats=S.cats.filter(u=>u.hp>0);
 S.foes=S.foes.filter(u=>{if(u.hp<=0){S.money=Math.min(mx,S.money+8);S.kg=(S.kg||0)+Math.round(u.mhp/50);return false}return true});
 S.fx.forEach(f=>f.t-=dt);S.fx=S.fx.filter(f=>f.t>0);
 if(S.en.hp<=0)end(1);else if(S.my.hp<=0)end(0)}
function end(w){S.over=true;S.fin=w&&S.i==9&&!P.clear.includes(9);const rb=st.rw*(1+st.hp/20000);let g=w?(P.clear.includes(S.i)?Math.round(rb/5):Math.round(rb*.8)):20;
 if(w&&!P.clear.includes(S.i))P.clear.push(S.i);g=Math.round((g+(S.kg||0))*(1+.1*(P.up.l||0)));P.gold+=g;save();
 $('mt').innerHTML=(w?'승리! 🎉':'패배... 😿')+'<br>+'+g+'💰';$('msg').style.display='flex'}
$('mb').onclick=()=>{$('msg').style.display='none';$('battle').classList.remove('on');$('home').classList.add('on');const fin=S&&S.fin;S=null;home();music('home');if(fin)story('end',()=>{})};
const X=x=>20+x/L*(W-40);
function hp(x,y,p,w){ctx.fillStyle='#0005';ctx.fillRect(x-w/2,y,w,5);ctx.fillStyle=p>.3?'#4caf50':'#e53935';ctx.fillRect(x-w/2,y,w*Math.max(0,p),5)}
function draw(){
 ctx.fillStyle=st.sky;ctx.fillRect(0,0,W,H);ctx.fillStyle=st.gr;ctx.fillRect(0,G,W,H-G);
 ctx.textAlign='center';ctx.textBaseline='bottom';ctx.font='54px serif';
 base(X(S.en.x),'#a0524a');base(X(S.my.x),'#e8873a');
 hp(X(S.en.x),G-64,S.en.hp/S.en.mhp,50);hp(X(S.my.x),G-64,S.my.hp/S.my.mhp,50);
 for(const u of [...S.foes,...S.cats]){const sz=u.r?Math.min(110,34+u.r*1.1):44;
  ctx.save();ctx.translate(X(u.x),G+2);if(u.team==1)ctx.scale(-1,1);drawU(ctx,u.e,u.evo?sz*1.15:sz,S.t*8+u.x*.3,u.evo,u.at!=null?Math.max(0,1-(S.t-u.at)*4):0);ctx.restore();
  hp(X(u.x),G-sz*1.2-8,u.hp/u.mhp,30)}
 for(const f of S.fx){if(f.beam){ctx.fillStyle='rgba(255,230,120,'+f.t*2+')';ctx.fillRect(0,G-50,W,50)}else{ctx.fillStyle='#fff';ctx.strokeStyle='#f5a623';ctx.lineWidth=3;ctx.beginPath();for(let q=0;q<10;q++){const r=q%2?6:14,a=q*Math.PI/5;ctx.lineTo(X(f.x)+Math.cos(a)*r,G-24+Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}}
 $('mny').textContent='💰 '+Math.floor(S.money)+' / '+S.mx;
 $('wup').textContent=S.lvl<9?`⬆ 지갑 Lv${S.lvl} (${S.lvl*60})`:'지갑 MAX';
 $('wup').disabled=S.lvl>=9||S.money<S.lvl*60;
 $('cannon').disabled=S.cannon<1;$('cannon').textContent=S.cannon<1?'🎯 '+Math.floor(S.cannon*100)+'%':'🎯 발사!';
 [...$('bar').children].forEach(b=>{const k=+b.dataset.k;if(isNaN(k))return;b.classList.toggle('no',S.money<S.dk[k].c);b.querySelector('i').style.transform='scaleY('+S.cd[k]/S.dk[k].cd+')'})}
async function cloud(){try{const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;const id=await u.id();if(!id)return;const ref=db.collection('data/users/'+id).doc('s_'+[...ID].map(c=>c.charCodeAt(0).toString(36)).join('_')),s=await ref.get();
 if(s.exists&&s.data().d){P=JSON.parse(s.data().d);try{localStorage.setItem('nk2:'+ID,s.data().d)}catch(e){}}

let AC=null,BG=null,MUTE=false;
const MEL={home:[523,659,784,659,880,784,659,523,587,698,880,698,784,659,587,494],battle:[330,330,392,330,440,392,330,294,330,330,523,494,440,392,349,330]},BAS={home:[131,131,175,196],battle:[110,110,147,165]};
